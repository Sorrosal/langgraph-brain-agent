# Production stack: PostgreSQL + backend API + nginx-served frontend (proxies /api/ to the backend).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Variables (put them in a `.env` file next to this file; never commit it):
#   ENVIRONMENT       must be "production" (enables strict settings validation)
#   JWT_SECRET        required, 32+ random characters
#   OPENAI_API_KEY    required
#   POSTGRES_PASSWORD required, also used in DATABASE_URL below
#   DATABASE_URL      required, e.g. postgresql://brain:<POSTGRES_PASSWORD>@postgres:5432/brain
#   CORS_ORIGINS      optional JSON list; not needed behind the same-origin /api proxy
#   FORWARDED_ALLOW_IPS optional; defaults to the compose network subnet (172.28.0.0/16) so the
#                     backend trusts X-Forwarded-For from the nginx container. Set it to your
#                     proxy address if you put another reverse proxy in front of nginx.
#   TAG               optional image tag when pulling published images (default: latest)
# Other backend settings (SMTP_*, IMAP_*, OTEL_*, ...) are read from the same file.

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/sorrosal/langgraph-brain-agent-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    stop_grace_period: 30s
    networks: [internal]
    environment:
      ENVIRONMENT: production
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/sorrosal/langgraph-brain-agent-frontend:${TAG:-latest}
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
